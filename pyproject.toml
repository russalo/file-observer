[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-observer"
version = "1.9.1"
description = "Not a file watcher — a one-shot, read-only scan that emits a deterministic JSON manifest of what's in a directory before you ingest it."
readme = "docs/README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Russell Pfister", email = "russalo@russalo.com"},
]
keywords = [
    "file-analysis", "metadata", "observation", "document-pipeline",
    "manifest", "deterministic", "provenance", "audit",
    "chatlog", "vector", "corpus",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: File Formats",
    "Topic :: System :: Filesystems",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["python-magic", "chardet"]

[project.optional-dependencies]
yaml = ["PyYAML"]
msg = ["olefile"]
security = ["defusedxml"]
pdf = ["pypdf"]   # v1.8: object-stream page_count/Info (tier 1; stdlib fallback if absent)
dev = ["pytest", "PyYAML", "olefile", "defusedxml", "pypdf"]

[project.urls]
Homepage = "https://github.com/russalo/file-observer"
Repository = "https://github.com/russalo/file-observer"
Issues = "https://github.com/russalo/file-observer/issues"
Documentation = "https://github.com/russalo/file-observer/blob/main/docs/README.md"
Changelog = "https://github.com/russalo/file-observer/blob/main/docs/HISTORY.md"

[project.scripts]
file-observer = "file_observer.scanner:main"
fo = "file_observer.scanner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Only collect the project's own tests. Without this, a bare `pytest` walks the
# repo root and tries to import test files inside scratch/corpora* (the harvested
# repos), which both errors on collection AND writes __pycache__/*.pyc into the
# shared corpora — polluting the empirical sweep (found running v1.7 against the
# full library, 2026-06-03).
testpaths = ["tests"]
