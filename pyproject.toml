[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-observer"
version = "1.48.0"
description = "Not a file watcher — a one-shot, read-only scan that emits a deterministic JSON manifest of what's in a directory before you ingest it."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Russell Pfister", email = "russalo@russalo.com"},
]
keywords = [
    "file-analysis", "metadata", "observation", "document-pipeline",
    "manifest", "deterministic", "provenance", "audit",
    "chatlog", "vector", "corpus",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: File Formats",
    "Topic :: System :: Filesystems",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# python-magic is excluded on Windows: the wheel installs without the libmagic DLL,
# and python-magic's import-time library search HANGS (not raises) on a Windows box
# with no libmagic — which would hang `import file_observer.scanner` itself. The v1.3
# pure-Python MIME fallback is built for exactly this: on Windows `import magic` raises
# ImportError → the fallback engages, so `pip install file-observer` just works. Windows
# users who want libmagic-grade MIME can install `python-magic-bin` (bundles the DLL).
dependencies = ["python-magic; platform_system != 'Windows'", "chardet"]

[project.optional-dependencies]
yaml = ["PyYAML"]
msg = ["olefile"]
security = ["purexml>=1.0.0"]   # v1.36: pure-stdlib, oracle-gated defusedxml replacement (a 2.0 is a breaking-contract re-review)
pdf = ["pypdf", "cryptography"]   # v1.8: object-stream page_count/Info (tier 1; stdlib fallback if absent). v1.12: cryptography required by pypdf for AES-256/V5 owner-locked PDFs (e.g. Caltrans 2025 specs)
watch = ["watchfiles"]   # v1.11: --watch FS-event backend (measured vs watchdog; watchfiles won 1:1 delivery + 43ms latency)
mcp = ["mcp>=1.0"]   # v1.37: MCP server (agent-native front-door) — the official MCP Python SDK; optional, runtime stays zero-required-dep
# v1.28.1: one-line full coverage — the union of every RUNTIME extra (NOT dev). Self-references
# the others so it can't drift (a new extra is picked up automatically). The drift-guard test
# `test_all_extra_covers_every_runtime_extra` fails CI if a runtime extra is ever omitted here.
all = ["file-observer[yaml,msg,security,pdf,watch,mcp]"]
dev = ["file-observer[all]", "pytest", "pytest-timeout", "jsonschema", "ruff"]   # v1.28.1: dev = all runtime extras + test tooling (jsonschema = DEV-only manifest-schema validation guard; runtime stays zero-dep). ruff added v1.47.1 (a static-analysis gate for the code-hygiene error class — see [tool.ruff.lint]).

[project.urls]
Homepage = "https://github.com/russalo/file-observer"
Repository = "https://github.com/russalo/file-observer"
Issues = "https://github.com/russalo/file-observer/issues"
Documentation = "https://github.com/russalo/file-observer/blob/main/README.md"
Changelog = "https://github.com/russalo/file-observer/blob/main/docs/HISTORY.md"

[project.scripts]
file-observer = "file_observer.scanner:main"
fo = "file_observer.scanner:main"
file-observer-mcp = "file_observer.mcp_server:main"   # v1.37: the MCP server (stdio); needs the [mcp] extra

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Safety net: no single test may run >120s. A genuine hang (e.g. a Windows-only
# blocking I/O / process-pool deadlock) then FAILS FAST with a traceback instead of
# running to the GitHub Actions 6h job limit. The whole suite is ~65s; the cap is
# generous. pytest-timeout picks signal method on POSIX, thread on Windows.
timeout = 120
# Only collect the project's own tests. Without this, a bare `pytest` walks the
# repo root and tries to import test files inside scratch/corpora* (the harvested
# repos), which both errors on collection AND writes __pycache__/*.pyc into the
# shared corpora — polluting the empirical sweep (found running v1.7 against the
# full library, 2026-06-03).
testpaths = ["tests"]

[tool.ruff.lint]
# v1.47.1: a DELIBERATELY NARROW static-analysis gate — the error CLASSES a polish pass found
# (and that CI should never let recur), NOT full style linting. Extend consciously.
#   F401 unused import   F811 redefinition   F821 undefined name
#   F841 unused local    F541 f-string without placeholders
# (F402 "import shadowed by loop variable" is deliberately NOT selected — two such shadows are
# correct-as-is; renaming them on the 560 KB scanner.py is churn for zero behavior gain.)
# Intentional import-availability tests carry `# noqa: F401`; ruff honors them.
select = ["F401", "F811", "F821", "F841", "F541"]
