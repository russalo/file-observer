[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = ["python-magic", "chardet"]

[project.optional-dependencies]
yaml = ["PyYAML"]
msg = ["olefile"]
security = ["defusedxml"]
dev = ["pytest", "PyYAML", "olefile", "defusedxml"]

[project.scripts]
scanner = "scanner.scanner:main"

[tool.setuptools.packages.find]
where = ["src"]
