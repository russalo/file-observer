# networks.yaml — Connectivity layers
# Defines how machines reach each other and the outside world.
# Nodes are defined in nodes.yaml — referenced here by id only.
#
# Comment key:
#   # KNOWN / ASSUMED / UNKNOWN: e.g. [example]

networks:

  tailscale_mesh:
    type: overlay_vpn
    provider: Tailscale
    tailnet_name: unknown  # UNKNOWN: your tailnet name — run `tailscale status` or check tailscale.com/admin
                           #   looks like: russellpfister@gmail.com or a custom name
    status: active
    nodes_on_mesh:
      - id: mbp
        tailscale_ip: 100.119.83.49   # KNOWN
      - id: delldev
        tailscale_ip: 100.70.235.124  # KNOWN
      - id: bossdev
        tailscale_ip: 100.78.245.17   # KNOWN
      - id: mini
        tailscale_ip: 100.120.154.111 # KNOWN
      - id: origin-core
        tailscale_ip: 100.89.175.30   # KNOWN
      - id: russ-iphone
        tailscale_ip: 100.120.114.62  # KNOWN
    nodes_not_on_mesh:
      - id: omen
        blocker: "Tailscale not installed"
    exit_node: origin-core  # KNOWN: system_state.yaml
    dns:
      magic_dns: unknown  # UNKNOWN: is MagicDNS enabled? Lets you use hostnames like "bossdev" instead of IPs
                          #   check tailscale.com/admin > DNS tab
      custom_domain: unknown  # UNKNOWN: e.g. tailXXXXX.ts.net — visible in Tailscale admin

  home_network:
    type: lan
    location: home  # ASSUMED: Russell's home — single location
    router:
      make_model: unknown  # UNKNOWN: e.g. "Eero Pro 6E", "ASUS RT-AX88U", "Netgear Orbi"
      admin_ip: unknown    # UNKNOWN: e.g. 192.168.1.1 or 10.0.0.1 — try those in browser on home network
    subnet: unknown        # UNKNOWN: e.g. 192.168.1.0/24 — visible in router admin
    dns: unknown           # UNKNOWN: e.g. 192.168.1.1 (router) or 1.1.1.1 (Cloudflare)
    isp: unknown           # UNKNOWN: e.g. "Cox", "Spectrum", "AT&T Fiber"
    connection_type: unknown  # UNKNOWN: e.g. "fiber", "cable", "5G home"
    speed_mbps:
      down: unknown  # UNKNOWN: run speedtest.net or fast.com
      up: unknown
    nodes_present_when_home:
      - mbp       # ASSUMED: always on at home
      - bossdev   # ASSUMED: stationary workstation
      - mini      # ASSUMED: headless, always plugged in at home
      - omen      # ASSUMED: desktop, always at home
      - delldev   # ASSUMED: when not at office or field
      - russ-iphone  # when on home WiFi

  work_network:
    type: lan
    location: "CP Construction — Ontario, CA"
    subnet: unknown   # UNKNOWN: run ipconfig on delldev when at the office — look for IPv4 Address
    router:
      make_model: unknown  # UNKNOWN: ask IT or check router label
      admin_ip: unknown
    isp: unknown
    nodes_present_when_at_office:
      - delldev   # ASSUMED: primary work machine brought to office
    remote_access_method: tailscale  # KNOWN: all other nodes access work resources via Tailscale
    notes:
      - "delldev connects directly when at the office"  # ASSUMED
      - "mbp, bossdev, origin-core all reach delldev resources via Tailscale when remote"  # ASSUMED

  dropbox_sync:
    type: cloud_sync
    provider: "Dropbox Business"
    account_email: unknown  # UNKNOWN: the Dropbox account email — probably russellp@cpconst.com or russalo@gmail.com
    plan: Business           # ASSUMED: CLAUDE.md says "Dropbox Business"
    vault_paths:
      delldev:  'C:\Users\russe\C P Construction Co Dropbox\'  # KNOWN: CLAUDE.md
      mbp: unknown    # UNKNOWN: e.g. /Users/russell/Library/CloudStorage/Dropbox-CPConstruction/
                      #   check Finder sidebar or Dropbox preferences
      bossdev: null   # KNOWN: Dropbox not installed — system_state.yaml gaps.unknowns
      mini: null      # KNOWN: Dropbox not installed
      origin-core: null  # KNOWN: Dropbox not installed
    sync_status:
      delldev: active   # KNOWN: primary sync machine
      mbp: active       # KNOWN: system_state.yaml installed_software includes Dropbox
    important_notes:
      - "Dropbox is sync, NOT backup — deletes propagate to all synced nodes"  # KNOWN
      - "Linux nodes cannot access vault directly — must go via Tailscale to delldev or mbp"  # ASSUMED based on no Dropbox on Linux

  mobile_data:
    type: cellular
    carrier: unknown  # UNKNOWN: e.g. "AT&T", "Verizon", "T-Mobile"
    plan: unknown
    nodes: [russ-iphone]
    notes:
      - "russ-iphone is on Tailscale and accessible via cellular when not on home WiFi"
