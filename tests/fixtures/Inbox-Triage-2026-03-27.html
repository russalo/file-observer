<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox Triage — 2026-03-27</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; padding: 16px; min-height: 100vh; }
  h1 { font-size: 1.3em; color: #7eb8da; margin-bottom: 4px; }
  .subtitle { font-size: 0.78em; color: #666; margin-bottom: 16px; }

  /* Dashboard */
  .dashboard { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .dash-card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 10px; padding: 12px 16px; min-width: 160px; flex: 1; }
  .dash-card h3 { font-size: 0.7em; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .dash-card .folder-name { font-size: 0.85em; font-weight: 700; margin-bottom: 2px; }
  .dash-card .folder-name.pkp { color: #4a9eff; }
  .dash-card .folder-name.tiq { color: #c084fc; }
  .dash-card .folder-name.sen { color: #f59e0b; }
  .dash-card .folder-name.infra { color: #4ade80; }
  .file-row { display: flex; justify-content: space-between; font-size: 0.72em; padding: 2px 0; border-bottom: 1px solid #1f2230; }
  .file-row:last-child { border: none; }
  .file-row .fname { color: #aaa; }
  .file-row .fcount { font-weight: 700; min-width: 16px; text-align: right; }
  .file-row .fcount.has { color: #4ade80; }
  .file-row .fcount.empty { color: #333; }

  /* Stats */
  .stats { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 8px; padding: 7px 12px; font-size: 0.78em; }
  .stat .num { font-size: 1.2em; font-weight: 700; }
  .stat.approved .num { color: #4ade80; }
  .stat.rejected .num { color: #f87171; }
  .stat.pending .num { color: #f59e0b; }
  .stat.total .num { color: #7eb8da; }

  /* Tag cloud filter */
  .tag-cloud { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .tag-cloud-label { font-size: 0.7em; color: #555; margin-right: 4px; }
  .tc-tag { font-size: 0.68em; padding: 3px 9px; border-radius: 12px; border: 1px solid #2a2d3a; background: #1a1d27; color: #888; cursor: pointer; transition: all 0.15s; }
  .tc-tag:hover { border-color: #4a9eff55; color: #ccc; }
  .tc-tag.active { background: #4a9eff22; border-color: #4a9eff; color: #4a9eff; }
  .tc-tag .count { font-size: 0.85em; color: #555; margin-left: 3px; }
  .tc-tag.active .count { color: #4a9eff88; }

  .batch-actions { display: flex; gap: 6px; margin-bottom: 12px; }
  .batch-btn { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 6px; padding: 5px 10px; color: #aaa; cursor: pointer; font-size: 0.7em; }
  .batch-btn:hover { border-color: #4a9eff55; color: #fff; }

  /* Items */
  .item { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; transition: all 0.15s; }
  .item.approved { border-color: #22c55e44; background: #22c55e08; }
  .item.rejected { border-color: #ef444433; background: #ef444408; opacity: 0.45; }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .item-body { flex: 1; }
  .item-text { font-size: 0.83em; line-height: 1.5; margin-bottom: 4px; }
  .item-routing { font-size: 0.7em; color: #666; }
  .item-source { font-size: 0.66em; color: #444; font-style: italic; margin-top: 2px; }

  /* Tags on items */
  .item-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .itag { font-size: 0.62em; padding: 2px 7px; border-radius: 10px; font-weight: 600; cursor: default; position: relative; }
  .itag .remove { display: none; cursor: pointer; margin-left: 4px; color: #f87171; font-weight: 400; }
  .itag:hover .remove { display: inline; }
  .itag.domain { background: #4a9eff18; color: #4a9eff; border: 1px solid #4a9eff33; }
  .itag.type { background: #f59e0b18; color: #f59e0b; border: 1px solid #f59e0b33; }
  .itag.target { background: #22c55e18; color: #4ade80; border: 1px solid #22c55e33; font-family: monospace; }
  .itag.custom { background: #a855f718; color: #c084fc; border: 1px solid #a855f733; }
  .add-tag-btn { font-size: 0.62em; padding: 2px 7px; border-radius: 10px; border: 1px dashed #3a3d4a; background: transparent; color: #555; cursor: pointer; }
  .add-tag-btn:hover { border-color: #4a9eff; color: #4a9eff; }

  /* Add tag popover */
  .tag-popover { display: none; position: absolute; z-index: 100; background: #12141c; border: 1px solid #2a2d3a; border-radius: 8px; padding: 8px; min-width: 220px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .tag-popover.visible { display: block; }
  .tag-popover input { width: 100%; background: #1a1d27; border: 1px solid #2a2d3a; color: #e0e0e0; padding: 5px 8px; border-radius: 5px; font-size: 0.78em; margin-bottom: 6px; }
  .tag-popover .suggestions { max-height: 120px; overflow-y: auto; }
  .tag-popover .sug { font-size: 0.72em; padding: 4px 8px; cursor: pointer; border-radius: 4px; color: #aaa; }
  .tag-popover .sug:hover { background: #4a9eff22; color: #4a9eff; }
  .tag-popover .sug-new { color: #4ade80; font-style: italic; }

  /* Actions */
  .actions { display: flex; gap: 5px; flex-shrink: 0; }
  .action-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #2a2d3a; background: #1a1d27; color: #555; cursor: pointer; font-size: 1em; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .action-btn:hover { border-color: #4a9eff55; color: #aaa; }
  .action-btn.approve-btn.selected { background: #22c55e22; border-color: #22c55e; color: #4ade80; }
  .action-btn.reject-btn.selected { background: #ef444422; border-color: #ef4444; color: #f87171; }

  /* Edit panel */
  .edit-panel { display: none; margin-top: 8px; padding: 8px; background: #12141c; border-radius: 8px; border: 1px solid #2a2d3a; }
  .edit-panel.visible { display: block; }
  .edit-panel label { font-size: 0.7em; color: #777; display: block; margin-bottom: 3px; }
  .edit-panel select { background: #1a1d27; border: 1px solid #2a2d3a; color: #e0e0e0; padding: 5px 8px; border-radius: 5px; font-size: 0.75em; width: 100%; margin-bottom: 6px; }
  .edit-panel textarea { background: #1a1d27; border: 1px solid #2a2d3a; color: #e0e0e0; padding: 5px 8px; border-radius: 5px; font-size: 0.75em; width: 100%; min-height: 40px; resize: vertical; }

  /* Export */
  .export-section { margin-top: 20px; padding: 14px; background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; }
  .export-title { font-size: 0.85em; font-weight: 600; margin-bottom: 10px; color: #7eb8da; }
  .export-btn { background: #4a9eff22; border: 1px solid #4a9eff; color: #4a9eff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 0.78em; font-weight: 600; transition: all 0.15s; margin-right: 6px; }
  .export-btn:hover { background: #4a9eff33; }
  .export-btn.green { background: #22c55e22; border-color: #22c55e; color: #4ade80; }
  .export-output { margin-top: 12px; display: none; }
  .export-output.visible { display: block; }
  .export-output pre { background: #12141c; border: 1px solid #2a2d3a; border-radius: 8px; padding: 12px; font-size: 0.7em; line-height: 1.6; white-space: pre-wrap; max-height: 400px; overflow-y: auto; color: #ccc; }
  .copy-btn { background: #2a2d3a; border: 1px solid #3a3d4a; color: #aaa; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.7em; margin-top: 6px; }
  .copy-btn:hover { color: #fff; border-color: #4a9eff; }

  .divider { border: none; border-top: 1px dashed #2a2d3a; margin: 14px 0; }
  .item-wrap { position: relative; }
</style>
</head>

<div class="subtitle">Pre-sorted items from today's session. Approve, reject, re-tag, or reroute. Tags are fully editable — add your own.</div>

<div class="dashboard" id="dashboard"></div>
<hr class="divider">
<div class="stats" id="stats">

<script>
const targetFiles = [
  'PKP/INBOX.md','PKP/DECISIONS.md','PKP/TASKS.md','PKP/VISION.md',
  'TIQ/INBOX.md','TIQ/DECISIONS.md','TIQ/TASKS.md','TIQ/VISION.md',
  'SEN/INBOX.md','SEN/DECISIONS.md','SEN/TASKS.md','SEN/VISION.md',
  'Mini-PC-Setup-Guide.md','CURRENT-STATE.md','DISCARD'
];

// Tag registry — grows as user adds tags
let allTags = new Set([
  'PKP','TIQ','SEN','Infra','DevOps','Dev Workflow',
  'Decision','Task','Reference','Idea',
  'LLM','Governance','Security','Networking','Automation'
]);

const items = [
  {id:1, text:"Context tags established: [PKP] Personal Knowledge Pipeline, [TIQ] TrenchIQ/cp-project, [SEN] Project Sentinel. Use to prevent AI cross-contamination.", tags:['PKP','Decision','Governance'], target:'PKP/DECISIONS.md', routing:"Core governance rule for all AI interactions.", source:"Cowork session"},
  {id:2, text:"Four project domains defined: A) DevOps/Infrastructure, B) Development Workflow, C) Project Sentinel, D) TrenchIQ. All personal time.", tags:['PKP','Decision'], target:'PKP/DECISIONS.md', routing:"Shapes how all work is categorized.", source:"Cowork session"},
  {id:3, text:"Inbox triage pattern: AI reads inbox → proposes routing → human approves. AI never writes directly to canonical files.", tags:['PKP','Decision','Governance','LLM'], target:'PKP/DECISIONS.md', routing:"The 'triage nurse' model — validated.", source:"Gemini + Cowork validation"},
  {id:4, text:"Timestamp convention: date/time periodically in long conversations. Always on summaries, reports, research.", tags:['PKP','Decision'], target:'PKP/DECISIONS.md', routing:"Helps track when decisions were made.", source:"Cowork session"},
  {id:5, text:"VPS exit node (origin-core) is the standard firewall bypass. Default: OFF. On when needed.", tags:['Infra','Decision','DevOps','Networking'], target:'PKP/DECISIONS.md', routing:"Infrastructure decision — affects all machines.", source:"Cowork session"},
  {id:6, text:"Gemini research mixes project contexts. Each project's docs must be governed independently.", tags:['PKP','Decision','Governance','LLM'], target:'PKP/DECISIONS.md', routing:"Lesson learned from processing Gemini dumps.", source:"Gemini dump analysis"},
  {id:7, text:"React vs HTMX/Django templates evaluation needed before TrenchIQ Milestone 3.", tags:['TIQ','Decision','Dev Workflow'], target:'TIQ/DECISIONS.md', routing:"Deferred — flag for Milestone 3.", source:"Tech stack eval"},
  {id:8, text:"Folder-based separation: AI-Workspace/PKP/, TIQ/, SEN/ — each with INBOX, DECISIONS, TASKS, VISION.", tags:['PKP','Decision','Governance'], target:'PKP/DECISIONS.md', routing:"Eliminates filename collision between projects.", source:"Cowork session — implemented"},
  {id:9, text:"Install Claude Code on Mini PC. Native installer. Exit node ON required.", tags:['Infra','Task','DevOps'], target:'PKP/TASKS.md', routing:"Mini PC setup continuation.", source:"Cowork session"},
  {id:10, text:"Disable USB ethernet adapter on BossDev to stop error popups.", tags:['Infra','Task','DevOps'], target:'PKP/TASKS.md', routing:"Cleanup from BossDev setup.", source:"Cowork session"},
  {id:11, text:"Turn off exit node on BossDev if still active.", tags:['Infra','Task','DevOps'], target:'PKP/TASKS.md', routing:"Cleanup from today.", source:"Cowork session"},
  {id:12, text:"Harden SSH on Mini: disable password auth, PermitRootLogin no, copy keys first.", tags:['Infra','Task','Security','DevOps'], target:'PKP/TASKS.md', routing:"Security hardening.", source:"Cowork session"},
  {id:13, text:"Set static IP or DHCP reservation for Mini (currently 192.168.1.140 DHCP).", tags:['Infra','Task','Networking','DevOps'], target:'PKP/TASKS.md', routing:"Prevents IP drift.", source:"Cowork session"},
  {id:14, text:"Remove WiFi hotspot config from Mini netplan. Contains plaintext password.", tags:['Infra','Task','Security'], target:'PKP/TASKS.md', routing:"Security cleanup.", source:"Cowork session"},
  {id:15, text:"Set up Obsidian Git sync across machines. Highest-leverage next step for the knowledge pipeline.", tags:['PKP','Task','DevOps'], target:'PKP/TASKS.md', routing:"Prerequisite for entire knowledge pipeline.", source:"Cowork + Gemini validation"},
  {id:16, text:"Process Chat dump in drop/ folder — 1.5MB transcript, zips, artifacts. Triage into buckets.", tags:['PKP','Task'], target:'PKP/TASKS.md', routing:"Clear the existing bottleneck.", source:"Cowork session"},
  {id:17, text:"Build fast capture workflow for inbox.md from any device. One action to dump a thought.", tags:['PKP','Task','Automation'], target:'PKP/TASKS.md', routing:"Closes the front door.", source:"Cowork session"},
  {id:18, text:"Set up bare Git repos on origin-core for cp-project and Sentinel.", tags:['Dev Workflow','Task','DevOps'], target:'PKP/TASKS.md', routing:"Enables develop-anywhere.", source:"Cowork session"},
  {id:19, text:"Set up rclone on Mini/BossDev for Google Drive access.", tags:['Infra','Task','DevOps'], target:'PKP/TASKS.md', routing:"Prerequisite for G Drive offload.", source:"Cowork session"},
  {id:20, text:"Set up Dropbox sync on Mini and BossDev. Evaluate daemon vs rclone.", tags:['Infra','Task','DevOps'], target:'PKP/TASKS.md', routing:"Gets job files on Linux machines.", source:"Cowork session"},
  {id:21, text:"Build MCP servers for Cowork→Mini/BossDev dispatch. VM is sandboxed — MCP is the bridge.", tags:['Infra','Task','DevOps','Automation','LLM'], target:'PKP/TASKS.md', routing:"Enables remote task execution.", source:"Cowork session"},
  {id:22, text:"Create daily chat summary as Cowork scheduled task.", tags:['PKP','Task','Automation','LLM'], target:'PKP/TASKS.md', routing:"Automated knowledge capture.", source:"Cowork session"},
  {id:23, text:"Mini PC: mini, russellp, TS 100.120.154.111, LAN 192.168.1.140, Ubuntu Server 24.04", tags:['Infra','Reference','DevOps'], target:'Mini-PC-Setup-Guide.md', routing:"Already in guide.", source:"Cowork session"},
  {id:24, text:"BossDev: bossdev, russellp, TS 100.78.245.17, LAN 192.168.1.141, Fedora, eno1", tags:['Infra','Reference','DevOps'], target:'Mini-PC-Setup-Guide.md', routing:"Add to guide.", source:"Cowork session"},
  {id:25, text:"origin-core (VPS): srv334254, TS 100.89.175.30, Ubuntu 24.04, Docker. Exit node.", tags:['Infra','Reference','DevOps'], target:'Mini-PC-Setup-Guide.md', routing:"Already in guide.", source:"Cowork session"},
  {id:26, text:"Corporate firewall blocks: apt, npm, Ubuntu repos. Bypass: Tailscale exit node.", tags:['Infra','Reference','Networking'], target:'Mini-PC-Setup-Guide.md', routing:"Already documented.", source:"Cowork session"},
  {id:27, text:"Cowork VM is sandboxed: loopback only, no Tailscale, no LAN. MCP required.", tags:['Infra','Reference','DevOps','LLM'], target:'CURRENT-STATE.md', routing:"Critical constraint for automation planning.", source:"Cowork session — tested"},
  {id:28, text:"MCP server to expose TrenchIQ repo to Claude Code — reads CHARTER.md live during dev.", tags:['TIQ','Idea','LLM','Dev Workflow'], target:'TIQ/VISION.md', routing:"Valuable but not until models are stable.", source:"Gemini — validated"},
  {id:29, text:"pgvector semantic search on historical EWOs. Field value-add for PMs.", tags:['TIQ','Idea','LLM'], target:'TIQ/VISION.md', routing:"Milestone 4+ territory.", source:"Gemini — validated"},
  {id:30, text:"LORE_INBOX.md for Sentinel — inbox/triage/promote for lore. Raw ideas → review → codex/.", tags:['SEN','Idea','Governance'], target:'SEN/VISION.md', routing:"Good pattern. Apply when Sentinel starts.", source:"Gemini — validated"},
  {id:31, text:"Nightly LLM triage of inbox.md — scheduled AI routing from BossDev or Mini.", tags:['PKP','Idea','Automation','LLM'], target:'PKP/VISION.md', routing:"Requires Git sync and inbox first.", source:"Gemini — pattern validated"}
];

let itemStates = {};
items.forEach(i => itemStates[i.id] = 'pending');
let activeTagFilter = null;
let openPopover = null;

function getAllTagCounts() {
  const counts = {};
  items.forEach(i => i.tags.forEach(t => { counts[t] = (counts[t]||0) + 1; }));
  return counts;
}

function renderTagCloud() {
  const counts = getAllTagCounts();
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  let html = '<span class="tag-cloud-label">Filter by tag:</span>';
  sorted.forEach(([tag, count]) => {
    html += `<span class="tc-tag ${activeTagFilter===tag?'active':''}" onclick="filterByTag('${tag}')">${tag}<span class="count">${count}</span></span>`;
  });
  if (activeTagFilter) {
    html += `<span class="tc-tag" onclick="filterByTag(null)" style="color:#f87171;border-color:#ef444433;">Clear</span>`;
  }
  document.getElementById('tag-cloud').innerHTML = html;
}

function filterByTag(tag) {
  activeTagFilter = activeTagFilter === tag ? null : tag;
  renderTagCloud();
  renderItems();
}

function renderDashboard() {
  const folders = [
    {name:'PKP', label:'Personal Knowledge Pipeline', cls:'pkp'},
    {name:'TIQ', label:'TrenchIQ', cls:'tiq'},
    {name:'SEN', label:'Project Sentinel', cls:'sen'},
    {name:'Infra', label:'Infrastructure', cls:'infra'}
  ];
  const files = ['INBOX.md','DECISIONS.md','TASKS.md','VISION.md'];
  const approved = items.filter(i => itemStates[i.id]==='approved');
  let html = '';
  folders.forEach(f => {
    if (f.name === 'Infra') {
      const c = approved.filter(i => i.target==='Mini-PC-Setup-Guide.md' || i.target==='CURRENT-STATE.md').length;
      html += `<div class="dash-card"><h3>Folder</h3><div class="folder-name ${f.cls}">${f.label}</div>
        <div class="file-row"><span class="fname">Guide + State</span><span class="fcount ${c?'has':'empty'}">${c}</span></div></div>`;
    } else {
      html += `<div class="dash-card"><h3>Folder</h3><div class="folder-name ${f.cls}">${f.label}</div>`;
      files.forEach(file => {
        const c = approved.filter(i => i.target === f.name+'/'+file).length;
        html += `<div class="file-row"><span class="fname">${file}</span><span class="fcount ${c?'has':'empty'}">${c}</span></div>`;
      });
      html += '</div>';
    }
  });
  document.getElementById('dashboard').innerHTML = html;
}

function renderItems() {
  const container = document.getElementById('items-container');
  container.innerHTML = '';
  let filtered = items;
  if (activeTagFilter) filtered = items.filter(i => i.tags.includes(activeTagFilter));

  filtered.forEach(item => {
    const state = itemStates[item.id];
    const div = document.createElement('div');
    div.className = `item-wrap`;
    div.innerHTML = `
      <div class="item ${state}">
        <div class="item-top">
          <div class="item-body">
            <div class="item-tags" id="tags-${item.id}">
              ${item.tags.map(t => `<span class="itag ${getTagClass(t)}">${t}<span class="remove" onclick="removeTag(${item.id},'${t}')">×</span></span>`).join('')}
              <button class="add-tag-btn" onclick="showTagPopover(event,${item.id})">+ tag</button>
            </div>
            <div class="item-text">${item.text}</div>
            <div class="item-routing">${item.routing}</div>
            <div class="item-source">Source: ${item.source}</div>
          </div>
          <div class="actions">
            <button class="action-btn approve-btn ${state==='approved'?'selected':''}" onclick="setState(${item.id},'approved')">&#10003;</button>
            <button class="action-btn reject-btn ${state==='rejected'?'selected':''}" onclick="setState(${item.id},'rejected')">&#10005;</button>
            <button class="action-btn" onclick="toggleEdit(${item.id})">&#9998;</button>
          </div>
        </div>
        <div class="edit-panel" id="edit-${item.id}">
          <label>Target file:</label>
          <select onchange="updateTarget(${item.id},this.value)">
            ${targetFiles.map(t => `<option value="${t}" ${item.target===t?'selected':''}>${t}</option>`).join('')}
          </select>
          <label>Notes:</label>
          <textarea placeholder="Optional..." id="notes-${item.id}"></textarea>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
  updateStats();
  renderDashboard();
}

function getTagClass(tag) {
  const domains = ['PKP','TIQ','SEN','Infra'];
  const types = ['Decision','Task','Reference','Idea'];
  if (domains.includes(tag)) return 'domain';
  if (types.includes(tag)) return 'type';
  return 'custom';
}

function removeTag(id, tag) {
  const item = items.find(i => i.id === id);
  item.tags = item.tags.filter(t => t !== tag);
  renderItems();
  renderTagCloud();
}

function addTag(id, tag) {
  tag = tag.trim();
  if (!tag) return;
  const item = items.find(i => i.id === id);
  if (!item.tags.includes(tag)) {
    item.tags.push(tag);
    allTags.add(tag);
  }
  closePopover();
  renderItems();
  renderTagCloud();
}

function showTagPopover(event, id) {
  event.stopPropagation();
  closePopover();
  const btn = event.target;
  const rect = btn.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'tag-popover visible';
  pop.style.position = 'fixed';
  pop.style.left = rect.left + 'px';
  pop.style.top = (rect.bottom + 4) + 'px';
  pop.innerHTML = `
    <input type="text" placeholder="Type a tag name..." id="tag-input-${id}" oninput="updateSuggestions(${id})" onkeydown="tagInputKey(event,${id})">
    <div class="suggestions" id="sug-${id}"></div>
  `;
  document.body.appendChild(pop);
  openPopover = pop;
  document.getElementById(`tag-input-${id}`).focus();
  updateSuggestions(id);
}

function updateSuggestions(id) {
  const input = document.getElementById(`tag-input-${id}`);
  const val = input.value.trim().toLowerCase();
  const item = items.find(i => i.id === id);
  const existing = new Set(item.tags);
  let matches = [...allTags].filter(t => !existing.has(t) && t.toLowerCase().includes(val));
  const sugDiv = document.getElementById(`sug-${id}`);
  let html = '';
  matches.slice(0, 8).forEach(t => {
    html += `<div class="sug" onclick="addTag(${id},'${t}')">${t}</div>`;
  });
  if (val && !matches.some(m => m.toLowerCase() === val)) {
    html += `<div class="sug sug-new" onclick="addTag(${id},'${input.value.trim()}')">+ Create "${input.value.trim()}"</div>`;
  }
  sugDiv.innerHTML = html;
}

function tagInputKey(event, id) {
  if (event.key === 'Enter') {
    const input = document.getElementById(`tag-input-${id}`);
    addTag(id, input.value);
  } else if (event.key === 'Escape') {
    closePopover();
  }
}

function closePopover() {
  if (openPopover) { openPopover.remove(); openPopover = null; }
}
document.addEventListener('click', (e) => {
  if (openPopover && !openPopover.contains(e.target)) closePopover();
});

function setState(id, state) {
  itemStates[id] = itemStates[id] === state ? 'pending' : state;
  renderItems();
}

function toggleEdit(id) {
  document.getElementById(`edit-${id}`).classList.toggle('visible');
}

function updateTarget(id, val) {
  items.find(i => i.id === id).target = val;
  renderItems();
}

function approveAll() {
  items.forEach(i => {
    if (!activeTagFilter || i.tags.includes(activeTagFilter)) itemStates[i.id] = 'approved';
  });
  renderItems();
}

function resetAll() {
  items.forEach(i => itemStates[i.id] = 'pending');
  renderItems();
}

function updateStats() {
  const a = Object.values(itemStates).filter(s=>s==='approved').length;
  const r = Object.values(itemStates).filter(s=>s==='rejected').length;
  document.getElementById('total-count').textContent = items.length;
  document.getElementById('approved-count').textContent = a;
  document.getElementById('rejected-count').textContent = r;
  document.getElementById('pending-count').textContent = items.length - a - r;
}

function exportApproved() {
  const approved = items.filter(i => itemStates[i.id]==='approved');
  const byTarget = {};
  approved.forEach(i => { if(!byTarget[i.target]) byTarget[i.target]=[]; byTarget[i.target].push(i); });
  let md = `# Triage Output — 2026-03-27\n**Approved:** ${approved.length} / ${items.length}\n\n`;
  Object.keys(byTarget).sort().forEach(target => {
    if (target === 'DISCARD') return;
    md += `---\n\n## → ${target}\n\n`;
    byTarget[target].forEach(i => {
      const notes = document.getElementById(`notes-${i.id}`)?.value || '';
      md += `### [${i.tags.join('][')}]\n${i.text}\n- **Routing:** ${i.routing}\n`;
      if (notes) md += `- **Notes:** ${notes}\n`;
      md += `\n`;
    });
  });
  const rejected = items.filter(i => itemStates[i.id]==='rejected');
  if (rejected.length) { md += `---\n\n## Rejected\n\n`; rejected.forEach(i => md += `- ~~${i.text.substring(0,80)}...~~\n`); }
  const pending = items.filter(i => itemStates[i.id]==='pending');
  if (pending.length) { md += `\n---\n\n## Pending\n\n`; pending.forEach(i => md += `- [${i.tags.join('][')}] ${i.text.substring(0,80)}...\n`); }
  document.getElementById('export-content').textContent = md;
  document.getElementById('export-output').classList.add('visible');
}

function copyExport() {
  navigator.clipboard.writeText(document.getElementById('export-content').textContent).then(() => {
    const b = document.querySelector('.copy-btn'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy to Clipboard',2000);
  });
}

renderItems();
