# primitives.yaml — What the system can DO
#
# A primitive is an atomic capability: one thing the system provides.
# Each primitive has: what it is, who provides it now, its status, and what depends on it.
#
# This is NOT a list of machines. That's nodes.yaml.
# This answers: "Can the system do X right now?" — in one place.
#
# Status values:
#   available     — working and accessible
#   installed     — present but not verified working
#   gap           — not available, needed
#   planned       — on roadmap, not built
#   unknown       — can't determine without checking
#
# Comment key:
#   # KNOWN / ASSUMED / UNKNOWN: e.g. [example]

primitives:

  # ── Compute ──────────────────────────────────────────────────────────────────

  local_cpu_compute:
    description: "General-purpose CPU compute — scripting, builds, data processing"
    available_on: [mbp, bossdev, delldev, mini, origin-core]
    status: available
    highest_capacity: mbp  # KNOWN: M3 Max 16-core

  gpu_compute_local:
    description: "Local GPU inference — run LLMs and ML models without cloud API calls"
    available_on:
      - node: mbp
        gpu: "M3 Max 40-core (unified memory)"
        status: available  # KNOWN: Ollama running
      - node: omen
        gpu: "RTX 5070 12GB"
        status: gap  # KNOWN: not on mesh, Ollama not installed
    depends_on: [tailscale_mesh]  # Ollama on mbp is only useful to other nodes via Tailscale

  # ── AI Inference ─────────────────────────────────────────────────────────────

  llm_inference_local:
    description: "Run LLM completions locally without sending data to Anthropic/OpenAI"
    provider: ollama on mbp
    models: [qwen3-coder:30b]
    endpoint: "http://100.119.83.49:11434"  # ASSUMED: Tailscale IP + Ollama port
    status: available
    accessible_from: [delldev, bossdev, mini, origin-core, russ-iphone]  # ASSUMED: via Tailscale
    latency: low_to_medium  # ASSUMED: local inference, but 30B model is slow on integrated GPU
    depends_on: [tailscale_mesh, mbp_power_on]

  llm_inference_proxy:
    description: "Route LLM calls to multiple backends via a single endpoint"
    provider: litellm on bossdev
    endpoint: unknown  # UNKNOWN: e.g. "http://100.78.245.17:4000"
    routing_config: unknown  # UNKNOWN: what models/backends does it proxy to?
    status: installed  # KNOWN: LiteLLM installed — running status unknown
    depends_on: [bossdev_power_on, litellm_config]

  llm_inference_cloud:
    description: "Anthropic API — Claude models via cloud"
    provider: Anthropic API
    models_in_use: [claude-sonnet-4-6]  # ASSUMED: current Cowork session model
    api_key_location: unknown  # UNKNOWN: which node(s) have ANTHROPIC_API_KEY set?
                               #   check: delldev (Cowork), bossdev (Claude Code), origin-core (Claude Code)
    status: available
    cost: per_token

  # ── Storage ──────────────────────────────────────────────────────────────────

  vault_storage:
    description: "Primary document vault — AI-Workspace files"
    provider: "Dropbox Business"
    path: 'C:\Users\russe\C P Construction Co Dropbox\Claude\AI-Workspace\'  # KNOWN
    synced_nodes: [delldev, mbp]  # KNOWN
    status: available
    is_backup: false  # KNOWN: Dropbox is sync only — deletes propagate

  vault_backup:
    description: "Off-site backup of vault — 3-2-1 rule"
    provider: none  # KNOWN: not implemented
    status: gap
    planned_provider: rclone on origin-core  # KNOWN: task A.1
    risk: "Single point of failure — Dropbox deletion or corruption has no recovery path"

  local_fast_storage:
    description: "Local disk for active development and Docker volumes"
    available_on:
      - node: bossdev
        disk_gb: 1000
        status: available
      - node: mini
        disk_gb: 500
        status: available  # ASSUMED: mini is offline but disk is fine
      - node: origin-core
        disk_gb: 100
        status: available

  job_file_storage:
    description: "CP Construction job files — plans, submittals, field docs"
    provider: "Dropbox Business"
    path: 'C:\Users\russe\C P Construction Co Dropbox\JOBS\'  # KNOWN: CLAUDE.md
    status: available

  # ── Sync and Transport ───────────────────────────────────────────────────────

  mesh_vpn:
    description: "Encrypted overlay network connecting all nodes"
    provider: Tailscale
    status: active  # KNOWN
    nodes_covered: [mbp, delldev, bossdev, mini, origin-core, russ-iphone]
    nodes_excluded: [omen]
    exit_node: origin-core

  cloud_sync:
    description: "Sync files across delldev and mbp without manual copy"
    provider: Dropbox Business
    status: available
    coverage: [delldev, mbp]  # KNOWN
    linux_coverage: none  # KNOWN: Dropbox not on Linux nodes

  file_transfer_between_nodes:
    description: "Ad-hoc file transfer between mesh nodes"
    method: tailscale  # ASSUMED: via Tailscale — e.g. scp, rsync, or Tailscale file send
    status: available
    notes: "No automated transfer pipeline configured — manual only"  # ASSUMED

  # ── Orchestration ────────────────────────────────────────────────────────────

  pipeline_execution:
    description: "Run inbox_sorter.py scan + execute"
    current_method: manual_pycharm  # KNOWN: PyCharm run configs on delldev
    headless_capable: false          # KNOWN: --root arg not added yet
    scheduled: false                 # KNOWN: no scheduler configured
    execution_node: delldev          # KNOWN: only authorized execute() node
    planned_method: "headless via --root arg, then cron/systemd on designated node"

  container_orchestration:
    description: "Run containerized services (Docker)"
    available_on:
      - node: bossdev
        status: available
      - node: mini
        status: installed  # offline
      - node: origin-core
        status: unknown
    compose_support: true  # ASSUMED: Docker on bossdev supports Compose
    kubernetes: false  # ASSUMED: no K8s configured anywhere

  task_scheduling:
    description: "Scheduled/automated task execution (cron, systemd timer, Prefect)"
    status: gap  # KNOWN: nothing scheduled today
    planned_provider: unknown  # UNKNOWN: cron on origin-core? systemd timer on bossdev? Prefect?

  # ── Access ────────────────────────────────────────────────────────────────────

  remote_terminal:
    description: "SSH/terminal access to headless nodes"
    method: ssh over tailscale  # ASSUMED: standard practice
    accessible_nodes: [bossdev, mini, origin-core]  # ASSUMED: all Linux headless nodes
    status: available
    client_nodes: [delldev, mbp]  # ASSUMED: where you SSH from

  mobile_access:
    description: "Access to AI tools and vault from iPhone"
    status: available
    tools: [Claude App, Tailscale]  # KNOWN
    vault_access: unknown  # UNKNOWN: can you reach vault files from iPhone? Via Dropbox app?
    capture_to_vault: gap  # KNOWN: no defined capture path from iPhone to drop/

  # ── Development ──────────────────────────────────────────────────────────────

  version_control:
    description: "Git + GitHub for source code and scripts"
    provider: GitHub
    account: russalo  # KNOWN
    status: available
    active_repos:
      - cp-project  # KNOWN: TrenchIQ
    planned_repos:
      - ai-workspace-scripts  # KNOWN: post Phase 4
    unknown_repos:
      - sentinel  # UNKNOWN: does a Sentinel repo exist?

  ci_cd:
    description: "Automated build and deploy pipeline"
    status: gap  # ASSUMED: no CI/CD configured anywhere
    planned: unknown

  package_registry:
    description: "Private package hosting"
    status: gap  # ASSUMED: not needed yet
    notes: "All projects use public package registries (PyPI, npm)"  # ASSUMED
