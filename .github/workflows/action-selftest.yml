name: Action self-test

# An Action can't be unit-tested — a CI run of it IS the test. This dogfoods the
# composite action (`uses: ./`) against this repo and asserts it produced a valid manifest.
on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-selftest.yml
  push:
    branches: [main]
    paths:
      - action.yml
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # the cross-platform venv layout (python/Scripts) is real (v1.15 lesson)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Run the File Observer action against this repo
        id: fo
        uses: ./
        with:
          path: .                          # scan the repo root (so the output lands in the scan tree)
          args: --specialists
          output: fo-selftest-manifest.json

      - name: Verify the manifest (valid + no self-inclusion)
        shell: bash
        run: |
          set -euo pipefail
          M="${{ steps.fo.outputs.manifest-path }}"
          test -f "$M" || { echo "manifest not written to $M"; exit 1; }
          PY="$(command -v python3 || command -v python)"
          "$PY" - "$M" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          assert m["manifest_checksum"], "no manifest_checksum"
          assert m["files"], "no files scanned"
          # the write-to-temp-then-move means the manifest must NOT include its own output file
          names = {f["filename"] for f in m["files"]}
          assert "fo-selftest-manifest.json" not in names, "manifest included its own output (self-inclusion)"
          print(f"OK — valid manifest, no self-inclusion: {len(m['files'])} files, "
                f"scanner {m['context']['scanner_version']}")
          PY
