name: tests

on:
  push:
    branches: [main]
  pull_request:

# UTF-8 mode everywhere — on Windows the default console is cp1252, so pytest
# crashes (no output, exit 1) the moment it prints a non-cp1252 char (e.g. a
# unicode test fixture name). PYTHONUTF8=1 makes stdout/stderr + the filesystem
# encoding UTF-8 on all OSes; a no-op on Linux/macOS, the fix on Windows.
env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12   # bound a hang (the Windows test-step hang under diagnosis)
    strategy:
      fail-fast: false   # one OS failing must not mask the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install libmagic (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install libmagic (macOS)
        if: runner.os == 'macOS'
        run: brew install libmagic
      # Windows: libmagic is intentionally NOT installed — this job exercises the
      # pure-Python MIME fallback (v1.3) on a real no-libmagic platform, and the
      # v1.15 init-guard for "python-magic imports but libmagic is absent".
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # DIAGNOSTIC (Windows hang bisection): pytest prints NOTHING before hanging, so
      # the hang is in the earliest import phase. Run each suspect stage as its own
      # unbuffered probe with a marker; the last marker before this step is killed
      # (step timeout-minutes) pinpoints the stage. TEMPORARY — remove once located.
      - name: Diagnose Windows import (bisection)
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 6
        run: |
          set -x
          python -u -c "print('P1: python -c runs')"
          python -u -c "import chardet; print('P2: chardet OK')"
          python -u -c "import magic; print('P3: import magic OK')" || echo "P3: import magic RAISED (handled by scanner)"
          python -u -c "import magic; m=magic.Magic(mime=True); print('P4: magic.Magic() built')" || echo "P4: magic.Magic() RAISED (handled)"
          python -u -c "import file_observer.scanner as s; print('P5: scanner import OK; s.magic=', s.magic)"
          python -u -c "from file_observer.scanner import Scanner; from pathlib import Path; import tempfile; sc=Scanner(source_dir=Path(tempfile.mkdtemp())); print('P6: Scanner() built; _magic=', sc._magic)"
          python -u -c "import sys; sys.path.insert(0,'tests'); import conftest; print('P7: conftest import OK; LIBMAGIC_AVAILABLE=', conftest.LIBMAGIC_AVAILABLE)"
          python -u -m pytest tests/ --collect-only -q 2>&1 | tail -3; echo "P8: collect-only done"
          echo "ALL PROBES PASSED — hang is in pytest execution, not import"
      - name: Run test suite
        # shell: bash on all OSes (git-bash on Windows) — avoids the pwsh stderr-swallow.
        shell: bash
        run: python -m pytest tests/ -q

  test-no-libmagic:
    # Deterministic coverage of the pure-Python MIME fallback — don't let the
    # Windows runner's libmagic state be the only thing exercising it. Removing
    # python-magic forces `import magic` to fail → self._magic is None → fallback.
    name: test (ubuntu, no python-magic — forced fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + dev deps, then remove python-magic
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip uninstall -y python-magic
      - name: Run test suite (no python-magic → pure-Python MIME fallback)
        run: python -m pytest tests/ -q
