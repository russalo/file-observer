name: tests

on:
  push:
    branches: [main]
  pull_request:

# UTF-8 mode everywhere — on Windows the default console is cp1252, so pytest
# crashes (no output, exit 1) the moment it prints a non-cp1252 char (e.g. a
# unicode test fixture name). PYTHONUTF8=1 makes stdout/stderr + the filesystem
# encoding UTF-8 on all OSes; a no-op on Linux/macOS, the fix on Windows.
env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # lint-only: no write access needed (leg-4/CodeRabbit)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # no git ops after checkout — don't leave a token on disk
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff check
        # The rule set is pinned in pyproject [tool.ruff.lint] — a NARROW static-analysis gate
        # for the code-hygiene error class (unused imports/locals, undefined names, redefinitions,
        # f-string nits) that a v1.47.1 polish pass found. Fails CI so the class can't recur.
        run: ruff check src/ tests/

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12   # bound a hang (the Windows test-step hang under diagnosis)
    strategy:
      fail-fast: false   # one OS failing must not mask the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        # v1.50: every Python minor the classifiers CLAIM is tested somewhere (a
        # test_packaging guard enforces the classifier<->matrix parity). The newer minors
        # run on Linux only — the OS-specific surface is already covered at 3.12.
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install libmagic (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install libmagic (macOS)
        if: runner.os == 'macOS'
        run: brew install libmagic
      # Windows: libmagic is intentionally NOT installed — this job exercises the
      # pure-Python MIME fallback (v1.3) on a real no-libmagic platform, and the
      # v1.15 init-guard for "python-magic imports but libmagic is absent".
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        # shell: bash on all OSes (git-bash on Windows) — avoids the pwsh stderr-swallow
        # that silently dropped pytest output on Windows.
        shell: bash
        run: python -m pytest tests/ -q

  test-no-libmagic:
    # Deterministic coverage of the pure-Python MIME fallback — don't let the
    # Windows runner's libmagic state be the only thing exercising it. Removing
    # python-magic forces `import magic` to fail → self._magic is None → fallback.
    name: test (ubuntu, no python-magic — forced fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + dev deps, then remove python-magic
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip uninstall -y python-magic
      - name: Run test suite (no python-magic → pure-Python MIME fallback)
        run: python -m pytest tests/ -q

  test-mcp-majors:
    # v1.48.1 (#174) claims BOTH MCP SDK majors work. An untested claim is a wish:
    # the default resolve now picks 2.x, so without this the 1.x branch is exercised
    # nowhere in CI and could rot silently — and the whole point of the aliased import
    # is that neither branch is allowed to break. Pin each major explicitly.
    name: test (mcp ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit specs, not arithmetic in a template: `$(( x + 1 ))` inside a
        # workflow expression is clever, and clever is how a CI job quietly stops
        # testing what it claims to.
        include:
          - label: "1.x"
            spec: "mcp>=1,<2"
          - label: "2.x"
            spec: "mcp>=2,<3"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with the MCP SDK major pinned
        env:
          MCP_SPEC: ${{ matrix.spec }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
          pip install "$MCP_SPEC"
      - name: Show which SDK resolved
        run: python -c "import mcp, importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Run the MCP-facing tests
        run: python -m pytest tests/test_v1_37.py tests/test_v1_39.py tests/test_v1_46_3.py tests/test_v1_48.py -q
